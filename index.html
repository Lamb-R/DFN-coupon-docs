<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡券中心 · 文档目录</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f3f5f8; color:#1f2937; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; padding:48px 20px;
  }
  header { text-align:center; margin-bottom:36px; }
  header .logo {
    display:inline-block; width:44px; height:44px; line-height:44px; border-radius:10px;
    background:linear-gradient(135deg,#1d6fe0,#0e9f6e); color:#fff; font-size:20px; font-weight:700;
    margin-bottom:14px;
  }
  h1 { font-size:24px; font-weight:600; letter-spacing:.5px; }
  header p { color:#6b7280; font-size:13px; margin-top:8px; }
  .grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:18px; width:100%; max-width:920px;
  }
  a.card {
    display:block; background:#fff; border:1px solid #e5e7eb; border-radius:12px;
    padding:22px 24px; text-decoration:none; color:inherit;
    transition:box-shadow .2s, transform .2s, border-color .2s;
  }
  a.card:hover { box-shadow:0 6px 18px rgba(29,111,224,.12); transform:translateY(-2px); border-color:#1d6fe0; }
  .card .tag {
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:4px;
    margin-bottom:10px; font-weight:500;
  }
  .tag.flow  { background:#e8f1ff; color:#1d6fe0; }
  .tag.prd   { background:#e6f7ef; color:#0e9f6e; }
  .tag.doc   { background:#f4f0ff; color:#7442d8; }
  .card h2 { font-size:16px; font-weight:600; margin-bottom:6px; }
  .card p  { font-size:13px; color:#6b7280; line-height:1.6; }
  .card .arrow { color:#1d6fe0; font-size:13px; margin-top:12px; display:inline-block; }
  .coming {
    border:1px dashed #cbd5e1; border-radius:12px; padding:22px 24px;
    color:#94a3b8; font-size:13px; background:transparent; text-align:center;
    display:flex; align-items:center; justify-content:center;
  }
  footer { margin-top:auto; padding-top:40px; color:#9ca3af; font-size:12px; text-align:center; }
</style>
</head>
<body>
  <header>
    <div class="logo">券</div>
    <h1>卡券中心 · 文档目录</h1>
    <p>DNDC 卡券中心业务文档 · GitHub Pages</p>
  </header>

  <div class="grid">
    <a class="card" href="./coupon-visibility-flow.html" target="_blank" rel="noopener">
      <span class="tag flow">流程确认</span>
      <h2>卡券中心卡包查询规则调整</h2>
      <p>现状 / 目标流程、场景 1（认证车主 + 快捷绑车共享查看）与场景 2（主账号授权副账号）对照、待业务方确认清单。</p>
      <span class="arrow">查看文档 →</span>
    </a>

    <div class="coming">更多文档将陆续添加…</div>
  </div>

  <footer>lamb-r.github.io/DFN-coupon-docs</footer>
</body>
</html>
